[project]
name = "recon-setup"
version = "0.1.2"
description = "Automate the setup and enumeration process for offensive security labs."
requires-python = ">=3.10"
dependencies = [
    "impacket",
    "libtmux==0.53.1",
    "pyyaml",
    "requests",
    "rich",
    "urllib3",
    "watchdog",
]

[project.scripts]
recon-setup = "recon_setup.main:main"

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# libtmux ships a pytest plugin (auto-loaded via entry points) whose fixtures
# carry marks, which pytest >= 9 rejects as an error. We don't use its
# fixtures, so disable the plugin rather than cap pytest to < 9.
addopts = "-p no:libtmux"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
